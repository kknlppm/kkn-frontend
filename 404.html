<!DOCTYPE html>
<html lang="id" data-theme="unfari">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman tidak ditemukan — KKN LPPM UNFARI</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-base-200">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="card bg-base-100 shadow-xl max-w-md w-full">
      <div class="card-body text-center">
        <h1 class="text-4xl font-bold text-primary">404</h1>
        <p class="text-base-content/70">Halaman yang Anda cari tidak ada.</p>
        <a href="/" class="btn btn-primary btn-sm mt-4">Kembali</a>
      </div>
    </div>
  </div>
  <script>
  (function () {
      // GitHub Pages menyajikan berkas statis, jadi /verifikasi/<token> tidak
      // punya berkas sendiri dan jatuh ke sini. QR pada 140+ sertifikat yang
      // sudah tercetak menunjuk bentuk jalur itu dan TIDAK BISA diubah —
      // jadi jalurnya yang harus tetap bekerja.
      var m = window.location.pathname.match(/\/verifikasi\/([a-fA-F0-9]{32})\/?$/);
      if (m) {
          window.location.replace("/verifikasi/?token=" + m[1]);
      }
  })();
  </script>
</body>
</html>
