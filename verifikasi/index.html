<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi Sertifikat — KKN LPPM Universitas Al-Ghifari</title>
  <meta name="description" content="Memeriksa keaslian sertifikat KKN Universitas Al-Ghifari">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="pita-atas" aria-hidden="true"></div>

<main class="min-h-screen flex items-center justify-center p-5">
  <!-- Kartu ini sengaja berbentuk lanskap seperti sertifikatnya sendiri,
       dengan batang biru di kaki — kutipan langsung dari dokumen yang
       sedang diperiksa. -->
  <article class="w-full max-w-2xl bg-kertas rounded-lg shadow-kartu overflow-hidden">

    <div class="px-8 pt-8 pb-2 text-center border-b border-garis-tipis">
      <div class="eyebrow">Lembaga Penelitian dan Pengabdian kepada Masyarakat</div>
      <h1 class="judul-halaman text-2xl mt-1">Universitas Al-Ghifari</h1>
      <p class="text-sm text-tinta-redup mt-1 mb-6">Verifikasi sertifikat Kuliah Kerja Nyata</p>
    </div>

    <div id="memuat" class="px-8 py-16 text-center font-data text-xs text-tinta-samar">
      MEMERIKSA…
    </div>

    <div id="hasil" hidden>
      <div id="lencana" class="px-8 py-5 text-center"></div>
      <dl id="rincian" class="px-8 pb-8 grid sm:grid-cols-2 gap-x-8"></dl>
    </div>

    <p class="px-8 pb-6 text-xs text-tinta-samar text-center">
      Halaman ini hanya menampilkan keterangan yang tercetak pada sertifikat.
    </p>

    <div class="h-2 bg-biru" aria-hidden="true"></div>
  </article>
</main>

<script type="module">
import { getJSON } from "/assets/js/jscroot/api.js";
import { getQueryString } from "/assets/js/jscroot/url.js";
import { backend } from "/assets/js/config.js";
import { el } from "/assets/js/ui.js";

// Sengaja TANPA penjaga login, dan sengaja TANPA tokenHeader() — siapa pun
// yang memegang sertifikat harus bisa memverifikasinya, itu gunanya QR di
// sana. Juga tidak lewat sehat(): pemeriksa yang tidak punya sesi tidak boleh
// dilempar ke /login/ hanya karena servernya menjawab 401.

const memuat = document.getElementById("memuat");
const hasil = document.getElementById("hasil");
const lencana = document.getElementById("lencana");
const rincian = document.getElementById("rincian");

// Token bisa datang dari jalur (/verifikasi/<token>) atau kueri.
// QR pada 140+ sertifikat yang sudah tercetak memakai bentuk jalur dan
// TIDAK BISA diubah; 404.html yang mengalihkannya ke sini.
function bacaToken() {
    const q = getQueryString().token;
    if (q) return q.trim();
    const bagian = window.location.pathname.replace(/\/+$/, "").split("/");
    const akhir = bagian[bagian.length - 1];
    return akhir && akhir !== "verifikasi" ? akhir.trim() : "";
}

function baris(label, nilai, mono) {
    if (!nilai) return;
    const dt = el("dt", "eyebrow mt-4", label);
    const dd = el("dd", (mono ? "font-data text-sm " : "font-medium ") + "mt-0.5");
    // textContent, tidak pernah innerHTML — nama mahasiswa adalah masukan
    // pengguna, dan halaman ini terbuka untuk umum.
    dd.textContent = nilai;
    rincian.appendChild(dt);
    rincian.appendChild(dd);
}

// takKetahuan dipakai saat server tak terjangkau. Ia SENGAJA dibedakan dari
// "tidak ditemukan": gagal jaringan bukan bukti sertifikat palsu, dan
// menyatakannya palsu bisa mempermalukan pemegang sertifikat yang sah di
// depan orang yang sedang memeriksanya.
function takKetahuan() {
    memuat.hidden = true;
    hasil.hidden = false;
    lencana.className = "px-8 py-5 text-center bg-belum-muda";
    lencana.appendChild(el("div", "judul-halaman text-lg text-belum", "Belum bisa diperiksa"));
    lencana.appendChild(el("p", "text-sm text-tinta-redup mt-1",
        "Server verifikasi tidak terjangkau. Ini bukan berarti sertifikatnya tidak sah — coba lagi sebentar lagi."));
}

function tampilkan(d) {
    if (sudahDijawab) return;
    sudahDijawab = true;
    memuat.hidden = true;
    hasil.hidden = false;

    if (!d || !d.sah) {
        lencana.className = "px-8 py-5 text-center bg-galat-muda";
        const t = el("div", "judul-halaman text-lg text-galat", "Sertifikat tidak ditemukan");
        const s = el("p", "text-sm text-tinta-redup mt-1",
            "Token pada QR tidak dikenali. Pastikan seluruh kode QR terpindai.");
        lencana.appendChild(t);
        lencana.appendChild(s);
        return;
    }

    lencana.className = "px-8 py-5 text-center bg-sah-muda";
    lencana.appendChild(el("div", "judul-halaman text-lg text-sah", "Sertifikat sah"));

    baris("Nama", d.nama);
    baris("NIM", d.nim, true);
    baris("Program studi", d.prodi);
    baris("Tahun akademik", d.tahun_ajaran, true);
    baris("Nomor sertifikat", d.no_sertifikat, true);
    baris("Tanggal terbit", d.tanggal);
}

let sudahDijawab = false;

const token = bacaToken();
if (!token) {
    tampilkan(null);
} else {
    // jscroot `api.js` menelan galat jaringan ke console dan TIDAK memanggil
    // callback-nya sama sekali. Tanpa penjaga waktu ini halaman berhenti di
    // "Memuat…" selamanya saat server mati.
    const penjagaWaktu = setTimeout(function () {
        if (!sudahDijawab) { sudahDijawab = true; takKetahuan(); }
    }, 10000);

    getJSON(backend.certificate.verify(encodeURIComponent(token)), function (h) {
        clearTimeout(penjagaWaktu);
        if (!h || typeof h.status !== "number") { takKetahuan(); return; }
        if (h.status >= 500) { takKetahuan(); return; }
        tampilkan(h.status === 200 && h.data ? h.data.data : null);
    });
}
</script>
</body>
</html>
