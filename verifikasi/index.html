<!DOCTYPE html>
<html lang="id" data-theme="unfari">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi Sertifikat — KKN LPPM UNFARI</title>
  <meta name="description" content="Verifikasi keaslian sertifikat KKN Universitas Al-Ghifari">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-base-200 font-sans">

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-lg bg-base-100 shadow-xl">
    <div class="card-body">

      <div class="text-center mb-4">
        <h1 class="text-lg font-bold text-primary">Verifikasi Sertifikat KKN</h1>
        <p class="text-sm text-base-content/60">Lembaga Penelitian dan Pengabdian kepada Masyarakat</p>
        <p class="text-sm text-base-content/60">Universitas Al-Ghifari</p>
      </div>

      <div id="memuat" class="text-center py-8">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>

      <div id="hasil" class="hidden">
        <div id="lencana" class="rounded-lg p-4 text-center mb-4"></div>
        <dl id="rincian" class="text-sm"></dl>
      </div>

      <p class="text-xs text-base-content/40 text-center mt-6">
        Halaman ini menampilkan data yang tercetak pada sertifikat.
        Nilai tidak ditampilkan.
      </p>
    </div>
  </div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
(function () {
    "use strict";
    // Halaman ini sengaja TANPA penjaga login. Siapa pun yang memegang
    // sertifikat harus bisa memverifikasinya — itu gunanya QR di sana.

    const memuat = document.getElementById("memuat");
    const hasil = document.getElementById("hasil");
    const lencana = document.getElementById("lencana");
    const rincian = document.getElementById("rincian");

    // Token bisa datang dari jalur (/verifikasi/<token>) atau kueri
    // (?token=). GitHub Pages menyajikan situs statis, jadi jalur bersarang
    // hanya bekerja lewat 404.html yang mengalihkan; kueri selalu bekerja.
    function bacaToken() {
        const q = new URLSearchParams(window.location.search).get("token");
        if (q) return q.trim();
        const bagian = window.location.pathname.replace(/\/+$/, "").split("/");
        const akhir = bagian[bagian.length - 1];
        return akhir && akhir !== "verifikasi" ? akhir.trim() : "";
    }

    function baris(label, nilai) {
        if (!nilai) return;
        const dt = document.createElement("dt");
        dt.className = "text-base-content/50 text-xs uppercase tracking-wide mt-3";
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.className = "font-medium";
        // textContent, tidak pernah innerHTML — nama mahasiswa adalah
        // masukan pengguna dan halaman ini terbuka untuk umum.
        dd.textContent = nilai;
        rincian.appendChild(dt);
        rincian.appendChild(dd);
    }

    function tampilkan(d) {
        memuat.classList.add("hidden");
        hasil.classList.remove("hidden");

        if (!d || !d.sah) {
            lencana.className = "rounded-lg p-4 text-center mb-4 bg-error/10 text-error";
            lencana.textContent = "SERTIFIKAT TIDAK DITEMUKAN";
            const p = document.createElement("p");
            p.className = "text-sm text-base-content/60 text-center";
            p.textContent = "Token pada QR tidak dikenali. Pastikan QR terpindai utuh.";
            rincian.appendChild(p);
            return;
        }

        lencana.className = "rounded-lg p-4 text-center mb-4 bg-success/10 text-success font-semibold";
        lencana.textContent = "SERTIFIKAT SAH";

        baris("Nama", d.nama);
        baris("NIM", d.nim);
        baris("Program studi", d.prodi);
        baris("Nomor sertifikat", d.no_sertifikat);
        baris("Tahun akademik", d.tahun_ajaran);
        baris("Tanggal terbit", d.tanggal);
    }

    const token = bacaToken();
    if (!token) {
        tampilkan(null);
    } else {
        Api.get("/verifikasi/" + encodeURIComponent(token))
            .then(function (res) { tampilkan(res && res.data); })
            .catch(function () { tampilkan(null); });
    }
})();
</script>
</body>
</html>
