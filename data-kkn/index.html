<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register KKN — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1400px] mx-auto px-5 py-5">

  <!-- Papan perintah. Tahun ajarannya cuma lima, jadi kelimanya ditampilkan
       — menyembunyikannya di dropdown menyamarkan sesuatu yang kecil. -->
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div id="segmenTahun" class="segmen" role="group" aria-label="Tahun ajaran"></div>

    <div class="flex-1 min-w-[14rem]">
      <label for="cari" class="sr-only">Cari peserta</label>
      <input id="cari" type="search" class="medan" spellcheck="false"
             placeholder="NIM, nama, atau judul KKN">
    </div>

    <output id="ringkasan" class="font-data text-xs text-tinta-redup whitespace-nowrap"></output>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div class="bg-kertas rounded-lg shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-14rem)]">
      <table class="register">
        <thead>
          <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th class="hidden lg:table-cell">Program studi</th>
            <th>Kelompok</th>
            <th class="hidden md:table-cell">TA</th>
            <th class="hidden xl:table-cell">Judul KKN</th>
            <th><span class="text-tinta-redup">H·S·L·QP·QL</span></th>
            <th class="text-right">Nilai</th>
            <th>Sertifikat</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <nav class="flex items-center justify-between gap-3 mt-4" aria-label="Halaman">
    <button id="sebelumnya" class="tombol-halus" disabled>← Sebelumnya</button>
    <span id="posisiHalaman" class="font-data text-xs text-tinta-redup"></span>
    <button id="berikutnya" class="tombol-halus" disabled>Berikutnya →</button>
  </nav>
</main>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/nav.js"></script>
<script>
(function () {
    "use strict";
    if (!Auth.requireLogin()) return;
    Nav.pasang("Register KKN");

    const isi = document.getElementById("isiTabel");
    const pesan = document.getElementById("pesan");
    const ringkasan = document.getElementById("ringkasan");
    const posisi = document.getElementById("posisiHalaman");
    const segmen = document.getElementById("segmenTahun");
    const inpCari = document.getElementById("cari");
    const btnPrev = document.getElementById("sebelumnya");
    const btnNext = document.getElementById("berikutnya");
    const KOLOM = 9;

    let halaman = 1, totalHalaman = 1, tahun = "";

    function barisPesan(teks) {
        const tr = UI.el("tr");
        const td = UI.el("td", "text-center py-12 text-tinta-samar text-sm", teks);
        td.colSpan = KOLOM;
        tr.appendChild(td);
        return tr;
    }

    function gambarBaris(r) {
        const tr = UI.el("tr");
        tr.appendChild(UI.sel(r.nim, "kode whitespace-nowrap"));

        const tdNama = UI.sel(r.name, "font-medium");
        if (r.ketua) {
            const k = UI.el("span", "tanda is-belum ml-1.5", "ketua");
            tdNama.appendChild(k);
        }
        tr.appendChild(tdNama);

        tr.appendChild(UI.sel(r.prodi, "text-xs text-tinta-redup hidden lg:table-cell"));
        // Sebagian data menuliskan "Kelompok 22", sebagian hanya "33".
        // Kolomnya sudah berjudul Kelompok; awalannya dibuang supaya
        // katanya tidak terbaca dua kali.
        tr.appendChild(UI.sel(String(r.kelompok || "").replace(/^kelompok\s+/i, ""), "kode"));
        tr.appendChild(UI.sel(r.tahun_ajaran, "kode whitespace-nowrap hidden md:table-cell"));

        const tdJudul = UI.sel(r.judul_kkn, "text-xs text-tinta-redup hidden xl:table-cell max-w-[22rem] truncate");
        tdJudul.title = r.judul_kkn || "";
        tr.appendChild(tdJudul);

        tr.appendChild(UI.deretNilai(r));

        const tdNilai = UI.el("td", "text-right whitespace-nowrap");
        if (r.nilai > 0) {
            tdNilai.appendChild(UI.el("span", "huruf-nilai font-data text-sm tabular-nums", r.nilai));
            tdNilai.appendChild(UI.el("span", "huruf-mutu text-biru ml-1.5", r.huruf || ""));
        } else {
            tdNilai.appendChild(UI.el("span", "text-tinta-samar", "—"));
        }
        tr.appendChild(tdNilai);

        tr.appendChild(r.has_cert ? UI.tanda("terbit", "sah") : UI.tanda("belum", "kosong"));
        return tr;
    }

    async function muat() {
        UI.sembunyikan(pesan);
        UI.kosongkan(isi);
        isi.appendChild(barisPesan("Memuat…"));

        const p = new URLSearchParams({ page: String(halaman), limit: "50" });
        if (tahun) p.set("tahun_ajaran", tahun);
        if (inpCari.value.trim()) p.set("q", inpCari.value.trim());

        try {
            const res = await Api.get("/api/participations?" + p.toString());
            if (!res) return;

            UI.kosongkan(isi);
            const baris = res.data || [];
            if (!baris.length) {
                isi.appendChild(barisPesan("Tidak ada peserta yang cocok."));
            } else {
                baris.forEach(function (r) { isi.appendChild(gambarBaris(r)); });
            }

            const m = res.meta || {};
            totalHalaman = m.total_pages || 1;
            ringkasan.textContent = (m.total || 0).toLocaleString("id-ID") + " peserta";
            posisi.textContent = "Halaman " + (m.page || 1) + " dari " + totalHalaman;
            btnPrev.disabled = (m.page || 1) <= 1;
            btnNext.disabled = (m.page || 1) >= totalHalaman;
        } catch (err) {
            UI.kosongkan(isi);
            isi.appendChild(barisPesan("Gagal memuat."));
            UI.pesan(pesan, err.message || "Gagal memuat data.", "galat");
        }
    }

    function tombolTahun(nilai, label) {
        const b = UI.el("button", "", label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(tahun === nilai));
        b.addEventListener("click", function () {
            tahun = nilai;
            halaman = 1;
            segmen.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.nilai === nilai));
            });
            muat();
        });
        b.dataset.nilai = nilai;
        return b;
    }

    async function muatTahun() {
        segmen.appendChild(tombolTahun("", "Semua"));
        try {
            const res = await Api.get("/api/academic-years");
            if (!res) return;
            (res.data || []).forEach(function (ta) {
                segmen.appendChild(tombolTahun(ta, ta));
            });
        } catch (e) { /* saringan opsional; register tetap terbuka */ }
    }

    btnPrev.addEventListener("click", function () { if (halaman > 1) { halaman--; muat(); } });
    btnNext.addEventListener("click", function () { if (halaman < totalHalaman) { halaman++; muat(); } });

    let jeda;
    inpCari.addEventListener("input", function () {
        clearTimeout(jeda);
        jeda = setTimeout(function () { halaman = 1; muat(); }, 350);
    });

    muatTahun();
    muat();
})();
</script>
</body>
</html>
